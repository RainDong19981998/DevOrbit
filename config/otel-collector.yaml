receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # 默认导出到日志（调试用）；生产环境替换为 LoongSuite / AgentScope Studio / Jaeger / Prometheus 等
  logging:
    loglevel: info
  # 生产示例（取消注释并配置）：
  # otlp/loongsuite:
  #   endpoint: loongsuite:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
